<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thailand Mesozoic Trackways Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-link { border-left: 4px solid #4f46e5; background: #f5f3ff; color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <nav class="w-72 bg-white border-r flex flex-col">
        <div class="p-6 border-b bg-indigo-900 text-white">
            <h1 class="font-bold text-lg leading-tight">Mesozoic Atlas: Thailand</h1>
        </div>
        <div id="menu" class="flex-1 overflow-y-auto py-4">
            <!-- Menu items injected here -->
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-12">
        <div id="content-view" class="max-w-4xl mx-auto bg-white shadow-sm border p-10 rounded-lg">
            <!-- Content injected here -->
        </div>
    </main>

    <script>
        let atlasData = {};

        async function init() {
            const res = await fetch('atlas_geothai.json');
            atlasData = await res.json();
            renderMenu();
            renderSection('intro'); // Default page
        }

        function renderMenu() {
            const menu = document.getElementById('menu');
            menu.innerHTML = atlasData.sections.map(s => `
                <button onclick="renderSection('${s.id}')" id="btn-${s.id}" 
                   class="w-full text-left px-6 py-3 transition hover:bg-gray-50 text-gray-700 font-medium">
                    ${s.title}
                </button>
            `).join('');
        }

        function renderSection(id) {
            // Update Menu UI
            document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active-link'));
            document.getElementById('btn-'+id).classList.add('active-link');

            const section = atlasData.sections.find(s => s.id === id);
            const view = document.getElementById('content-view');

            let html = `<h2 class="text-3xl font-bold mb-6 text-indigo-900 border-b pb-4">${section.title}</h2>`;
            
            if (section.content) html += `<p class="text-lg leading-relaxed text-gray-800 mb-6">${section.content}</p>`;

            // Render Table if Section is Inventory
            if (section.type === 'table') {
                html += `
                    <div class="overflow-x-auto mt-6">
                        <table class="w-full text-sm text-left border">
                            <thead class="bg-gray-100">
                                <tr><th class="p-2 border">ID</th><th class="p-2 border">Site</th><th class="p-2 border">Formation</th><th class="p-2 border">Age</th></tr>
                            </thead>
                            <tbody>
                                ${section.data.map(d => `<tr><td class="p-2 border">${d.id}</td><td class="p-2 border font-bold">${d.name}</td><td class="p-2 border">${d.fm}</td><td class="p-2 border">${d.age}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
            }

            // Render Subsections if they exist (Results section)
            if (section.subsections) {
                html += section.subsections.map(sub => `
                    <div class="mt-8">
                        <h3 class="text-xl font-bold text-indigo-700 mb-2">${sub.title}</h3>
                        <p class="text-gray-700 leading-relaxed">${sub.content}</p>
                    </div>
                `).join('');
            }

            view.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
