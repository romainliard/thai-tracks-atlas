<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesozoic Footprint Atlas of Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0c0e12; color: #e2e8f0; }
        h1, h2, h3, .heading-font { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Themed Accents */
        .jp-border { border-color: #164e63; }
        .caution-bar {
            background: repeating-linear-gradient(-45deg, #facc15, #facc15 10px, #171717 10px, #171717 20px);
            height: 6px;
        }
        
        .sidebar-item { border-left: 4px solid transparent; transition: all 0.2s; }
        .sidebar-item:hover { background: #064e3b; border-left-color: #facc15; color: white; }
        .active-site { background: #064e3b; border-left-color: #facc15; color: white; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0c0e12; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <nav class="w-80 bg-[#11141b] border-r border-slate-800 flex flex-col z-40">
        <div class="caution-bar"></div>
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl text-white italic leading-tight">Mesozoic Atlas<br><span class="text-yellow-400">Thailand</span></h1>
            <p class="text-[10px] mono text-slate-500 mt-2 tracking-widest uppercase">Ichnological Database</p>
        </div>
        
        <div id="menu" class="flex-1 overflow-y-auto py-4">
            <button onclick="renderIntro()" class="w-full text-left px-6 py-3 sidebar-item text-slate-400 font-bold text-sm">SUMMARY ABSTRACT</button>
            <button onclick="renderTable()" class="w-full text-left px-6 py-3 sidebar-item text-slate-400 font-bold text-sm">SITE INVENTORY TABLE</button>
            
            <div class="px-6 mt-8 mb-2 text-[10px] font-black text-slate-600 uppercase tracking-widest">Scientific Localities</div>
            <div id="site-list" class="space-y-0.5">
                <!-- Site links -->
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-12 bg-[#0c0e12]">
        <div id="content-view" class="max-w-5xl mx-auto min-h-full">
            <div class="flex items-center justify-center h-64 text-slate-600 animate-pulse">
                INITIALIZING DATA STREAM...
            </div>
        </div>
    </main>

    <script>
        let atlasData = { sites: [] };

        async function init() {
            try {
                const res = await fetch('atlas.json'); 
                atlasData = await res.json();
                renderSiteMenu();
                renderIntro(); 
            } catch (err) {
                document.getElementById('content-view').innerHTML = `
                    <div class="border-2 border-red-800 p-8 bg-red-950/20 text-red-500 rounded">
                        <h2 class="heading-font text-2xl mb-2">Connection Error</h2>
                        <p class="mono text-xs">Failed to load atlas.json: ${err.message}</p>
                    </div>
                `;
            }
        }

        function renderSiteMenu() {
            const list = document.getElementById('site-list');
            list.innerHTML = atlasData.sites.map(s => `
                <button onclick="renderSiteDetail(${s.id})" id="btn-${s.id}" class="w-full text-left px-8 py-2 text-[11px] mono sidebar-item text-slate-500">
                    ID_${s.id.toString().padStart(2, '0')} // ${s.name.toUpperCase()}
                </button>
            `).join('');
        }

        function renderIntro() {
            window.scrollTo(0,0);
            const view = document.getElementById('content-view');
            view.innerHTML = `
                <div class="border-b-4 border-yellow-400 pb-6 mb-10">
                    <h2 class="text-6xl font-black text-white italic">Project Inventory</h2>
                    <p class="mono text-yellow-400 text-xs mt-2 uppercase tracking-widest">Mesozoic Vertebrate Footprints of Thailand</p>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                    <div class="lg:col-span-2 space-y-6 text-slate-300 text-lg leading-relaxed">
                        <p>Thailand preserves one of the most extensive records of Mesozoic vertebrate tracks in Tropical Asia. This database reassesses all known <span class="text-white font-bold">Triassic to Cretaceous</span> tracksites within the Khorat Group.</p>
                        
                        <div class="bg-[#1a1d24] p-6 border-l-4 border-green-700 rounded shadow-inner">
                            <h4 class="heading-font text-green-500 text-sm mb-3">Core Findings</h4>
                            <p class="text-sm italic text-slate-400 leading-relaxed">
                                "The Thai record documents diverse assemblages including chirotheriids, early theropods, sauropodomorphs, ornithopods, sauropods, and crocodilians... capturing a major faunal transition from non-dinosaurian archosaurs to some of the earliest dinosaurs in the region."
                            </p>
                        </div>
                    </div>
                    
                    <div class="bg-[#11141b] border border-slate-800 p-6 rounded shadow-2xl">
                        <h3 class="heading-font text-xs text-slate-500 mb-6 tracking-widest">Metadata Summary</h3>
                        <div class="space-y-4 mono text-[10px]">
                            <div><p class="text-slate-600 uppercase">Primary Source</p><p class="text-slate-300">${atlasData.metadata.source}</p></div>
                            <div><p class="text-slate-600 uppercase">Geographic Scope</p><p class="text-slate-300">${atlasData.metadata.region}</p></div>
                            <div><p class="text-slate-600 uppercase">Total Localities</p><p class="text-white font-bold">${atlasData.metadata.total_sites} REGISTERED</p></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTable() {
            window.scrollTo(0,0);
            const view = document.getElementById('content-view');
            view.innerHTML = `
                <h2 class="heading-font text-3xl mb-8 text-white">Full Inventory <span class="text-yellow-400">Analysis</span></h2>
                <div class="overflow-x-auto rounded border border-slate-800 shadow-2xl">
                    <table class="w-full text-left border-collapse bg-[#11141b]">
                        <thead>
                            <tr class="bg-slate-800 text-[10px] mono text-white uppercase tracking-tighter">
                                <th class="p-4">Site_ID</th>
                                <th class="p-4">Locality_Name</th>
                                <th class="p-4">Stratigraphic_Fm</th>
                                <th class="p-4">Age_Stage</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800 mono text-[11px]">
                            ${atlasData.sites.map(s => `
                                <tr class="hover:bg-green-900/30 transition-colors cursor-pointer group" onclick="renderSiteDetail(${s.id})">
                                    <td class="p-4 text-slate-500">#${s.id}</td>
                                    <td class="p-4 font-bold text-yellow-500 group-hover:text-white uppercase">${s.name}</td>
                                    <td class="p-4 text-slate-400 italic">${s.stratigraphy.formation}</td>
                                    <td class="p-4 text-slate-500">${s.stratigraphy.stage}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderSiteDetail(id) {
            window.scrollTo(0,0);
            const site = atlasData.sites.find(s => s.id === id);
            const view = document.getElementById('content-view');
            
            document.querySelectorAll('#site-list button').forEach(b => b.classList.remove('active-site'));
            document.getElementById('btn-'+id)?.classList.add('active-site');

            view.innerHTML = `
                <div class="flex justify-between items-end mb-10 border-b-2 border-slate-800 pb-8">
                    <div>
                        <nav class="mono text-[10px] text-yellow-500 mb-2 font-bold tracking-[0.2em] uppercase">Locality Record / ${site.stratigraphy.serie}</nav>
                        <h2 class="text-6xl font-black text-white italic tracking-tighter uppercase">${site.name}</h2>
                        <p class="mono text-xs text-slate-500 mt-2">${site.location}</p>
                    </div>
                    <div class="text-right">
                        <div class="bg-yellow-400 text-black px-4 py-1 text-[10px] font-black mono mb-2 uppercase">Verified Locality</div>
                        <span class="mono text-4xl font-black text-slate-800">REF_${site.id.toString().padStart(2, '0')}</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-10">
                        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-5 bg-[#11141b] border-t-2 border-green-600 shadow-lg">
                                <h4 class="mono text-[9px] text-slate-500 uppercase font-black mb-1">Formation</h4>
                                <p class="heading-font text-white text-base">${site.stratigraphy.formation}</p>
                            </div>
                            <div class="p-5 bg-[#11141b] border-t-2 border-green-600 shadow-lg">
                                <h4 class="mono text-[9px] text-slate-500 uppercase font-black mb-1">Stage</h4>
                                <p class="heading-font text-white text-base">${site.stratigraphy.stage}</p>
                            </div>
                        </section>

                        <section class="bg-[#11141b] border border-slate-800 p-8 rounded shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-4 opacity-5 mono text-[40px] font-black uppercase pointer-events-none italic">ICHNO</div>
                            <h3 class="heading-font text-sm text-yellow-500 mb-6 border-b border-slate-800 pb-4">Ichnological Data</h3>
                            <div class="space-y-6">
                                <div>
                                    <h4 class="mono text-[10px] text-slate-500 uppercase mb-2 font-bold">Trackmakers</h4>
                                    <p class="text-lg font-bold text-slate-200 leading-tight">${site.ichnology.trackmakers.join(' • ')}</p>
                                </div>
                                <div>
                                    <h4 class="mono text-[10px] text-slate-500 uppercase mb-2 font-bold">Ichnogenus</h4>
                                    <p class="text-sm italic text-slate-400 font-serif">${site.ichnology.genus.join(', ')}</p>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-green-900/40 border border-green-800 p-6 rounded shadow-lg">
                            <h3 class="heading-font text-[10px] text-green-400 mb-4 tracking-widest uppercase">Field Status</h3>
                            <div class="space-y-4 mono text-[11px]">
                                <div>
                                    <p class="text-slate-500 uppercase text-[9px] mb-1 font-bold">Conservation Index</p>
                                    <p class="text-slate-200 font-bold leading-tight">${site.conservation}</p>
                                </div>
                                <div>
                                    <p class="text-slate-500 uppercase text-[9px] mb-1 font-bold">Discovery Record</p>
                                    <p class="text-slate-200 font-bold">${site.discovery.discoverer} // ${site.discovery.year}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-black/40 border border-slate-800 p-6 rounded italic shadow-inner">
                            <h4 class="mono text-[9px] font-black text-slate-600 uppercase mb-2 tracking-widest">Comparative Taxa</h4>
                            <p class="text-[11px] text-slate-400 leading-relaxed uppercase">${site.taxa}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
