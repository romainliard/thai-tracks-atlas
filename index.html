<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesozoic Footprint Atlas of Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0c0e12; color: #e2e8f0; }
        h1, h2, h3, .heading-font { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .caution-bar {
            background: repeating-linear-gradient(-45deg, #facc15, #facc15 10px, #171717 10px, #171717 20px);
            height: 6px;
        }

        /* Specific Formation Styles for Sidebar */
        .fm-huai-hin-lat { background-color: #ddd6fe; color: #4c1d95; border-left: 6px solid #8b5cf6; } /* Pastel Violet */
        .fm-nam-phong { background-color: #bae6fd; color: #0c4a6e; border-left: 6px solid #0ea5e9; }    /* Pastel Blue */
        .fm-phra-wihan { background-color: #064e3b; color: #ecfdf5; border-left: 6px solid #065f46; }    /* Deep Green */
        .fm-sao-khua { background-color: #10b981; color: #064e3b; border-left: 6px solid #059669; }      /* Light Green */
        .fm-phu-phan { background-color: #6ee7b7; color: #064e3b; border-left: 6px solid #34d399; }      /* Even Lighter Green */
        .fm-khok-kruat { background-color: #ecfdf5; color: #064e3b; border-left: 6px solid #a7f3d0; }    /* Cream Green */
        
        .sidebar-item { 
            transition: all 0.2s; 
            margin-bottom: 2px;
            opacity: 0.85;
        }
        .sidebar-item:hover { opacity: 1; transform: translateX(4px); }
        .active-site { opacity: 1; transform: translateX(8px); box-shadow: -4px 0 15px rgba(250, 204, 21, 0.3); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0c0e12; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <nav class="w-80 bg-[#11141b] border-r border-slate-800 flex flex-col z-40 shadow-2xl">
        <div class="caution-bar"></div>
        <div class="p-6 border-b border-slate-800 bg-black/20">
            <h1 class="text-xl text-white italic leading-tight">Mesozoic Atlas<br><span class="text-yellow-400 uppercase tracking-tighter">Thailand</span></h1>
            <p class="text-[9px] mono text-slate-500 mt-2 tracking-[0.3em] uppercase">Stratigraphic Database</p>
        </div>
        
        <div id="menu" class="flex-1 overflow-y-auto py-4">
            <button onclick="renderIntro()" class="w-full text-left px-6 py-3 hover:bg-slate-800 text-slate-400 font-bold text-xs tracking-widest border-l-4 border-transparent mb-4 transition-all uppercase">Summary Abstract</button>
            <button onclick="renderTable()" class="w-full text-left px-6 py-3 hover:bg-slate-800 text-slate-400 font-bold text-xs tracking-widest border-l-4 border-transparent mb-8 transition-all uppercase">Inventory Table</button>
            
            <div class="px-6 mb-3 text-[10px] font-black text-slate-600 uppercase tracking-widest flex justify-between">
                <span>Localities</span>
                <span>Formation Map</span>
            </div>
            <div id="site-list" class="px-2 space-y-1">
                <!-- Site links will be generated here -->
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-12 bg-[#0c0e12]">
        <div id="content-view" class="max-w-5xl mx-auto min-h-full">
            <div class="flex items-center justify-center h-64 text-slate-600 animate-pulse mono text-xs">
                INITIALIZING DATA_STREAM...
            </div>
        </div>
    </main>

    <script>
        let atlasData = { sites: [] };

        async function init() {
            try {
                const res = await fetch('atlas.json'); 
                atlasData = await res.json();
                renderSiteMenu();
                renderIntro(); 
            } catch (err) {
                document.getElementById('content-view').innerHTML = `
                    <div class="border-2 border-red-800 p-8 bg-red-950/20 text-red-500 rounded">
                        <h2 class="heading-font text-2xl mb-2">Connection Error</h2>
                        <p class="mono text-xs">Failed to load atlas.json: ${err.message}</p>
                    </div>
                `;
            }
        }

        // Helper to determine the CSS class based on formation name
        function getFmClass(fm) {
            const name = fm.toLowerCase();
            if (name.includes("huai hin lat")) return "fm-huai-hin-lat";
            if (name.includes("nam phong")) return "fm-nam-phong";
            if (name.includes("phra wihan")) return "fm-phra-wihan";
            if (name.includes("sao khua")) return "fm-sao-khua";
            if (name.includes("phu phan")) return "fm-phu-phan";
            if (name.includes("khok kruat")) return "fm-khok-kruat";
            return "bg-slate-800 text-white"; // Fallback
        }

        function renderSiteMenu() {
            const list = document.getElementById('site-list');
            list.innerHTML = atlasData.sites.map(s => {
                const colorClass = getFmClass(s.stratigraphy.formation);
                return `
                <button onclick="renderSiteDetail(${s.id})" id="btn-${s.id}" 
                    class="w-full text-left px-4 py-2 rounded-sm text-[10px] font-bold mono sidebar-item ${colorClass}">
                    ${s.id.toString().padStart(2, '0')} // ${s.name.toUpperCase()}
                </button>
                `;
            }).join('');
        }

        function renderIntro() {
            window.scrollTo(0,0);
            const view = document.getElementById('content-view');
            view.innerHTML = `
                <div class="border-b-4 border-yellow-400 pb-6 mb-10">
                    <h2 class="text-6xl font-black text-white italic tracking-tighter">Project Inventory</h2>
                    <p class="mono text-yellow-400 text-xs mt-2 uppercase tracking-widest">Mesozoic Vertebrate Footprints of Thailand</p>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                    <div class="lg:col-span-2 space-y-6 text-slate-300 text-lg leading-relaxed">
                        <p>Thailand preserves one of the most extensive records of Mesozoic vertebrate tracks in Tropical Asia. This database reassesses all known <span class="text-white font-bold underline decoration-yellow-500">Triassic to Cretaceous</span> tracksites within the Khorat Group.</p>
                        
                        <div class="bg-[#1a1d24] p-8 border-l-8 border-green-700 rounded-sm shadow-2xl">
                            <h4 class="heading-font text-green-500 text-sm mb-4 tracking-widest">Executive Findings</h4>
                            <p class="text-base italic text-slate-300 leading-relaxed font-serif">
                                "The Thai record documents diverse assemblages including chirotheriids, early theropods, sauropodomorphs, ornithopods, sauropods, and crocodilians... capturing a major faunal transition from non-dinosaurian archosaurs to some of the earliest dinosaurs in the region."
                            </p>
                        </div>
                    </div>
                    
                    <div class="bg-[#11141b] border border-slate-800 p-6 rounded shadow-2xl">
                        <h3 class="heading-font text-[10px] text-slate-500 mb-6 tracking-[0.2em] border-b border-slate-800 pb-2 uppercase">System Metadata</h3>
                        <div class="space-y-6 mono text-[10px]">
                            <div><p class="text-slate-600 uppercase mb-1">Primary Source</p><p class="text-slate-300 leading-relaxed">${atlasData.metadata.source}</p></div>
                            <div><p class="text-slate-600 uppercase mb-1">Geographic Scope</p><p class="text-slate-300">${atlasData.metadata.region}</p></div>
                            <div><p class="text-slate-600 uppercase mb-1">Database Size</p><p class="text-white font-bold text-sm underline decoration-yellow-500">${atlasData.metadata.total_sites} REGISTERED SITES</p></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTable() {
            window.scrollTo(0,0);
            const view = document.getElementById('content-view');
            view.innerHTML = `
                <h2 class="heading-font text-3xl mb-8 text-white">Stratigraphic <span class="text-yellow-400">Analysis</span></h2>
                <div class="overflow-x-auto rounded border border-slate-800 shadow-2xl bg-[#11141b]">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-800 text-[9px] mono text-white uppercase tracking-[0.2em]">
                                <th class="p-5">Ref_ID</th>
                                <th class="p-5">Locality_Name</th>
                                <th class="p-5">Formation</th>
                                <th class="p-5">Age_Stage</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800 mono text-[11px]">
                            ${atlasData.sites.map(s => `
                                <tr class="hover:bg-green-900/40 transition-colors cursor-pointer group" onclick="renderSiteDetail(${s.id})">
                                    <td class="p-5 text-slate-600">ID_${s.id}</td>
                                    <td class="p-5 font-bold text-yellow-500 group-hover:text-white uppercase tracking-tight">${s.name}</td>
                                    <td class="p-5 text-slate-400 italic">${s.stratigraphy.formation}</td>
                                    <td class="p-5 text-slate-500">${s.stratigraphy.stage}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderSiteDetail(id) {
            window.scrollTo(0,0);
            const site = atlasData.sites.find(s => s.id === id);
            const view = document.getElementById('content-view');
            
            document.querySelectorAll('#site-list button').forEach(b => b.classList.remove('active-site'));
            document.getElementById('btn-'+id)?.classList.add('active-site');

            view.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 border-b-2 border-slate-800 pb-8">
                    <div class="mb-6 md:mb-0">
                        <nav class="mono text-[10px] text-yellow-500 mb-2 font-bold tracking-[0.3em] uppercase">Locality_Record // ${site.stratigraphy.serie}</nav>
                        <h2 class="text-7xl font-black text-white italic tracking-tighter uppercase leading-none">${site.name}</h2>
                        <p class="mono text-xs text-slate-500 mt-4 underline decoration-green-800 underline-offset-4 font-bold tracking-widest">${site.location.toUpperCase()}</p>
                    </div>
                    <div class="text-right flex flex-row md:flex-col items-center md:items-end gap-4">
                        <div class="bg-yellow-400 text-black px-4 py-1 text-[10px] font-black mono uppercase">Validated Record</div>
                        <span class="mono text-5xl font-black text-slate-800 tracking-tighter">REF_${site.id.toString().padStart(2, '0')}</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-10">
                        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-6 bg-[#11141b] border-l-4 border-green-600 shadow-xl">
                                <h4 class="mono text-[9px] text-slate-500 uppercase font-black mb-2 tracking-widest">Formation</h4>
                                <p class="heading-font text-white text-xl">${site.stratigraphy.formation}</p>
                            </div>
                            <div class="p-6 bg-[#11141b] border-l-4 border-green-600 shadow-xl">
                                <h4 class="mono text-[9px] text-slate-500 uppercase font-black mb-2 tracking-widest">Age_Stage</h4>
                                <p class="heading-font text-white text-xl">${site.stratigraphy.stage}</p>
                            </div>
                        </section>

                        <section class="bg-[#11141b] border border-slate-800 p-8 rounded-sm shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-4 opacity-5 mono text-[60px] font-black uppercase pointer-events-none italic tracking-tighter">ICHNO</div>
                            <h3 class="heading-font text-sm text-yellow-500 mb-8 border-b border-slate-800 pb-4 tracking-widest">Ichnological Synthesis</h3>
                            <div class="space-y-8">
                                <div>
                                    <h4 class="mono text-[10px] text-slate-500 uppercase mb-3 font-bold tracking-widest">Assessed Trackmakers</h4>
                                    <p class="text-2xl font-black text-slate-200 leading-tight tracking-tight">${site.ichnology.trackmakers.join(' • ').toUpperCase()}</p>
                                </div>
                                <div>
                                    <h4 class="mono text-[10px] text-slate-500 uppercase mb-3 font-bold tracking-widest">Ichnogenus Identification</h4>
                                    <p class="text-base italic text-slate-400 font-serif leading-relaxed">${site.ichnology.genus.join(', ')}</p>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-green-900/20 border-t-4 border-green-700 p-6 shadow-2xl">
                            <h3 class="heading-font text-[11px] text-green-500 mb-6 tracking-[0.2em] uppercase underline decoration-green-800 underline-offset-8">Field Assessment</h3>
                            <div class="space-y-6 mono text-[11px]">
                                <div>
                                    <p class="text-slate-600 uppercase text-[9px] mb-2 font-bold tracking-widest">Conservation Index</p>
                                    <p class="text-slate-200 font-bold leading-relaxed">${site.conservation.toUpperCase()}</p>
                                </div>
                                <div>
                                    <p class="text-slate-600 uppercase text-[9px] mb-2 font-bold tracking-widest">Discovery Credit</p>
                                    <p class="text-slate-200 font-bold">${site.discovery.discoverer.toUpperCase()} / YR_${site.discovery.year}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-black/40 border border-slate-800 p-6 rounded-sm shadow-inner relative">
                            <h4 class="mono text-[9px] font-black text-slate-700 uppercase mb-3 tracking-widest">Comparative Taxa</h4>
                            <p class="text-[11px] text-slate-500 italic leading-relaxed uppercase">${site.taxa}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
