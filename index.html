<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InGen Ichnology Division: Thailand Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for that InGen look -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Public+Sans:wght@900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --jp-green: #064e3b;
            --jp-yellow: #facc15;
            --jp-red: #991b1b;
            --jp-dark: #0f172a;
        }

        body { font-family: 'Space Grotesk', sans-serif; background-color: #020617; }
        .terminal-font { font-family: 'Courier Prime', monospace; }
        .ingen-title { font-family: 'Public Sans', sans-serif; text-transform: uppercase; letter-spacing: -0.05em; }

        /* Caution Stripe Pattern */
        .caution-stripes {
            background: repeating-linear-gradient(
                -45deg,
                #facc15,
                #facc15 10px,
                #000 10px,
                #000 20px
            );
        }

        /* Scanline Effect */
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .border-ingen { border: 2px solid #334155; }
        .active-site { border-left: 6px solid #facc15; background: #1e293b; color: white; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-200">

    <!-- Scanline Visual Overlay -->
    <div class="fixed inset-0 crt-overlay z-50"></div>

    <!-- Sidebar Navigation -->
    <nav class="w-80 bg-slate-900 border-r-4 border-black flex flex-col z-40">
        <!-- Header with Caution Stripes -->
        <div class="caution-stripes h-4 w-full"></div>
        <div class="p-6 bg-slate-900 border-b-2 border-slate-800">
            <h1 class="ingen-title text-2xl font-black leading-none text-white italic">InGen</h1>
            <p class="terminal-font text-[10px] text-yellow-400 mt-1 uppercase font-bold tracking-tighter">Ichnology Division // Project Thailand</p>
        </div>
        
        <div id="menu" class="flex-1 overflow-y-auto py-4 bg-black/20">
            <div class="px-6 mb-2 terminal-font text-[10px] text-slate-500 font-bold uppercase">Main Systems</div>
            <button onclick="renderIntro()" class="w-full text-left px-6 py-3 transition hover:bg-slate-800 text-slate-300 terminal-font text-sm flex items-center">
                <span class="mr-3 text-yellow-500">▶</span> ACCESS_FILE: INTRO
            </button>
            <button onclick="renderTable()" class="w-full text-left px-6 py-3 transition hover:bg-slate-800 text-slate-300 terminal-font text-sm flex items-center">
                <span class="mr-3 text-yellow-500">▶</span> SYSTEM_QUERY: INVENTORY
            </button>
            
            <div class="px-6 mt-8 mb-2 terminal-font text-[10px] text-slate-500 font-bold uppercase">Locality Database</div>
            <div id="site-list" class="space-y-0.5">
                <!-- Site links will be generated here -->
            </div>
        </div>
        
        <div class="p-4 bg-black text-[9px] terminal-font text-slate-600 border-t border-slate-800">
            STATUS: SYSTEM_ONLINE // SECURE_ENCRYPTION_ACTIVE
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-12 relative bg-[#0a0f1e]">
        <!-- Topographical Map Background Decal (Optional) -->
        <div class="absolute top-0 right-0 p-10 opacity-10 pointer-events-none">
            <svg width="200" height="200" viewBox="0 0 100 100" class="fill-yellow-500"><path d="M10 10 H90 V90 H10 Z" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 2"/></svg>
        </div>

        <div id="content-view" class="max-w-5xl mx-auto border-2 border-slate-800 bg-slate-900/80 p-8 lg:p-12 rounded-sm min-h-full shadow-2xl backdrop-blur-sm">
            <div class="flex items-center justify-center h-64 terminal-font text-yellow-500/50 animate-pulse">
                [ ACCESSING ENCRYPTED ATLAS DATA... ]
            </div>
        </div>
    </main>

    <script>
        let atlasData = { sites: [] };

        async function init() {
            try {
                const res = await fetch('atlas.json'); 
                atlasData = await res.json();
                renderSiteMenu();
                renderIntro(); 
            } catch (err) {
                document.getElementById('content-view').innerHTML = `
                    <div class="border-4 border-red-600 p-8 bg-black text-red-500 terminal-font">
                        <h2 class="font-bold text-3xl mb-4">CRITICAL SYSTEM ERROR</h2>
                        <p>DATA_LINK_FAILURE: atlas.json not detected.</p>
                        <p class="mt-4 text-xs">ERR_CODE: ${err.message}</p>
                    </div>
                `;
            }
        }

        function renderSiteMenu() {
            const list = document.getElementById('site-list');
            list.innerHTML = atlasData.sites.map(s => `
                <button onclick="renderSiteDetail(${s.id})" id="btn-${s.id}" class="w-full text-left px-8 py-2 text-[11px] terminal-font transition hover:bg-slate-800 text-slate-400 border-l-4 border-transparent hover:text-white">
                    LOC_${s.id.toString().padStart(2, '0')} // ${s.name.toUpperCase()}
                </button>
            `).join('');
        }

        function renderIntro() {
            const view = document.getElementById('content-view');
            view.innerHTML = `
                <div class="border-b-2 border-yellow-500 pb-6 mb-8">
                    <h2 class="ingen-title text-5xl font-black text-white italic tracking-tighter">PROJECT THAILAND</h2>
                    <p class="terminal-font text-yellow-500 text-xs mt-2">MESOZOIC FOOTPRINT SYNTHESIS // AUTHORIZED ACCESS ONLY</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-12 text-slate-300">
                    <div class="space-y-6">
                        <p class="terminal-font text-sm leading-relaxed">
                            <span class="text-white font-bold">SUMMARY:</span> Thailand preserves one of the most extensive records of Mesozoic vertebrate tracks in Tropical Asia. 
                            This system reassesses all known Triassic to Cretaceous vertebrate tracksites across the Khorat Plateau.
                        </p>
                        <div class="bg-black/40 p-4 border border-slate-700 rounded">
                            <h4 class="terminal-font text-[10px] text-yellow-500 mb-2 font-black uppercase">Database Metadata</h4>
                            <ul class="terminal-font text-[10px] space-y-1 text-slate-400">
                                <li>SOURCE: ${atlasData.metadata.source}</li>
                                <li>LOCALITIES: ${atlasData.metadata.total_sites}</li>
                                <li>REGION: SOUTH_EAST_ASIA.IND_TERRANE</li>
                            </ul>
                        </div>
                    </div>
                    <div class="border-2 border-red-900 bg-red-950/20 p-6 rounded relative overflow-hidden">
                        <div class="caution-stripes h-1 absolute top-0 left-0 w-full opacity-30"></div>
                        <h3 class="ingen-title text-red-500 text-xl font-black mb-4 italic">CLASSIFIED ABSTRACT</h3>
                        <p class="text-xs terminal-font leading-loose">
                            The Thai record documents diverse assemblages including <span class="text-white">chirotheriids, early theropods, sauropodomorphs, ornithopods, sauropods,</span> and <span class="text-white">crocodilians</span>. 
                            Assemblages capture a major faunal transition, revealing the co-occurrence of non-dinosaurian archosaurs and early dinosaurs.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderTable() {
            const view = document.getElementById('content-view');
            view.innerHTML = `
                <h2 class="terminal-font text-2xl font-bold mb-8 text-yellow-500 flex items-center">
                    <span class="animate-pulse mr-3">█</span> SYSTEM_QUERY: SITE_INVENTORY
                </h2>
                <div class="overflow-x-auto border border-slate-800 rounded">
                    <table class="w-full terminal-font text-[11px] text-left border-collapse bg-black/20">
                        <thead>
                            <tr class="bg-slate-800 text-white uppercase">
                                <th class="p-3 border-r border-slate-700">CODE</th>
                                <th class="p-3 border-r border-slate-700">LOCALITY_NAME</th>
                                <th class="p-3 border-r border-slate-700">FORMATION</th>
                                <th class="p-3">AGE_EST</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${atlasData.sites.map(s => `
                                <tr class="hover:bg-yellow-500 hover:text-black transition-colors cursor-pointer group" onclick="renderSiteDetail(${s.id})">
                                    <td class="p-3 border-r border-slate-800 font-bold">LOC_${s.id}</td>
                                    <td class="p-3 border-r border-slate-800 font-bold">${s.name.toUpperCase()}</td>
                                    <td class="p-3 border-r border-slate-800 opacity-70">${s.stratigraphy.formation}</td>
                                    <td class="p-3 opacity-70 font-mono">${s.stratigraphy.stage}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderSiteDetail(id) {
            const site = atlasData.sites.find(s => s.id === id);
            const view = document.getElementById('content-view');
            
            // Highlight sidebar
            document.querySelectorAll('#site-list button').forEach(b => b.classList.remove('active-site'));
            document.getElementById('btn-'+id).classList.add('active-site');

            view.innerHTML = `
                <div class="flex justify-between items-start mb-8 border-b-2 border-slate-800 pb-6">
                    <div>
                        <nav class="terminal-font text-[10px] text-yellow-500 mb-2 font-bold tracking-widest uppercase">/ REPOS / THAI_LOCALITY / ${site.stratigraphy.formation.replace(/ /g, '_')}</nav>
                        <h2 class="ingen-title text-6xl font-black text-white italic tracking-tighter">${site.name}</h2>
                    </div>
                    <div class="text-right">
                        <div class="caution-stripes h-8 w-24 mb-2"></div>
                        <span class="terminal-font text-3xl font-black text-slate-700">#${site.id.toString().padStart(2, '0')}</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
                    <div class="lg:col-span-2 space-y-8">
                        <section class="grid grid-cols-2 gap-4">
                            <div class="p-4 bg-black/40 border-l-2 border-yellow-500">
                                <p class="terminal-font text-[9px] text-slate-500 uppercase font-bold mb-1">STRAT_FORMATION</p>
                                <p class="terminal-font font-bold text-white uppercase text-sm">${site.stratigraphy.formation}</p>
                            </div>
                            <div class="p-4 bg-black/40 border-l-2 border-yellow-500">
                                <p class="terminal-font text-[9px] text-slate-500 uppercase font-bold mb-1">CHRONO_STAGE</p>
                                <p class="terminal-font font-bold text-white uppercase text-sm">${site.stratigraphy.stage}</p>
                            </div>
                        </section>

                        <section class="p-6 border-2 border-slate-800 bg-slate-900">
                            <h3 class="terminal-font text-xs font-black text-yellow-500 uppercase mb-4 tracking-widest underline">ICHNO_DATA_REPORT</h3>
                            <div class="space-y-4">
                                <div>
                                    <p class="terminal-font text-[9px] text-slate-500 uppercase mb-1">Trackmakers Identified</p>
                                    <p class="terminal-font text-sm font-bold text-slate-200">${site.ichnology.trackmakers.join(' // ')}</p>
                                </div>
                                <div>
                                    <p class="terminal-font text-[9px] text-slate-500 uppercase mb-1">Assigned Ichnogenus</p>
                                    <p class="terminal-font text-xs italic text-slate-400">${site.ichnology.genus.join(' • ')}</p>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="bg-yellow-500 p-6 text-black flex flex-col justify-between rounded-sm">
                        <div>
                            <h3 class="ingen-title text-xl font-black mb-6 italic border-b border-black/20 pb-2 leading-none">SECURITY_LOG</h3>
                            <div class="space-y-4 terminal-font text-[11px]">
                                <div>
                                    <p class="font-black uppercase">Conservation_Stat</p>
                                    <p class="font-bold">${site.conservation.toUpperCase()}</p>
                                </div>
                                <div>
                                    <p class="font-black uppercase">Discovery_Credit</p>
                                    <p class="font-bold">${site.discovery.discoverer.toUpperCase()} (${site.discovery.year})</p>
                                </div>
                            </div>
                        </div>
                        <div class="mt-8 border-2 border-black p-2 text-center font-black terminal-font text-[9px] animate-pulse">
                            AUTHENTICATED_ACCESS
                        </div>
                    </div>
                </div>

                <div class="mt-12 p-6 bg-black border-l-4 border-red-700">
                    <h4 class="terminal-font text-[9px] font-black text-red-500 uppercase mb-2">Comparison_Taxa_Reference</h4>
                    <p class="terminal-font text-[11px] text-slate-500 italic leading-relaxed uppercase">${site.taxa}</p>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
